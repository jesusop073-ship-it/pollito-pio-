name: Verificar canales IPTV

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-streams:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar el estado de cada canal
        run: |
          SUPABASE_URL="https://twxzplqqxqsfntfipotz.supabase.co"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3eHpwbHFxeHFzZm50Zmlwb3R6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDc5NjYsImV4cCI6MjEwNDg4Mzk2Nn0.Z-IZ_KHHYFtN6UfvDwk2ZfV2FTXGq51AO0qKfVTyfaM"
          SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

          echo "Consultando canales activos en Supabase..."
          curl -s "$SUPABASE_URL/rest/v1/channels?select=id,name,stream_url&is_active=eq.true" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            | jq -c '.[]' > channels.jsonl

          FAILED_FILE=$(mktemp)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          while IFS= read -r row; do
            id=$(echo "$row" | jq -r '.id')
            name=$(echo "$row" | jq -r '.name')
            url=$(echo "$row" | jq -r '.stream_url')
            status=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 -L "$url" || echo "000")
            echo "-> $name : HTTP $status"

            if [[ "$status" == "200" || "$status" == "206" ]]; then
              label="ok"
            else
              label="caido"
              echo "$name (HTTP $status) - $url" >> "$FAILED_FILE"
            fi

            patch_code=$(curl -s -o /tmp/patch_resp.json -w "%{http_code}" -X PATCH \
              "$SUPABASE_URL/rest/v1/channels?id=eq.$id" \
              -H "apikey: $SERVICE_KEY" \
              -H "Authorization: Bearer $SERVICE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=representation" \
              -d "{\"last_status\": \"$label\", \"last_http_code\": $status, \"last_checked_at\": \"$NOW\"}")
            echo "   PATCH hacia Supabase -> HTTP $patch_code"
            echo "   Respuesta: $(cat /tmp/patch_resp.json)"
          done < channels.jsonl

          if [ -s "$FAILED_FILE" ]; then
            echo ""
            echo "Canales caidos detectados:"
            cat "$FAILED_FILE"
            exit 1
          fi

          echo "Todos los canales responden correctamente."
